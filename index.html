<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site avec Effet Parallaxe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        #site {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding-bottom: 150px; /* Réserve de l'espace pour le footer */
        }

        #top {
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 150px;
            filter: drop-shadow(0 0 15px #0ff);
        }

        .neon-text {
            color: #0ff;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #0ff,
                         0 0 20px #0ff,
                         0 0 30px #0ff;
        }

        .scroll-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            animation: bounce 2s infinite;
            opacity: 0.8;
            color: white;
            font-size: 2rem;
        }

        .section {
            height: 100vh; /* Chaque section occupe toute la hauteur de la fenêtre */
            padding: 50px;
            background-color: #111; /* Couleur de fond des sections */
            color: white; /* Couleur du texte */
        }

        .img-section {
            height: 100vh; /* Chaque image occupe toute la hauteur de la fenêtre */
        }

        .fixed-img {
            position: fixed; /* L'image reste fixe pendant le scroll */
            top: 0; /* Alignée en haut de la fenêtre */
            left: 0; 
            width: 100%; /* S'étend sur toute la largeur */
            height: 100vh; /* S'étend sur toute la hauteur de la fenêtre */
            object-fit: cover; /* L'image s'adapte sans être déformée */
            z-index: -1; /* L'image reste derrière le contenu */
        }

        #footer {
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%;
            height: 150px; 
            background-color: #333; 
            color:white; 
          display:flex ;
          align-items:center ;
          justify-content:center ;
          font-size-adjustable;}
          
          @keyframes bounce {from }
    </style>
</head>
<body>
    <div id="site">
        <section id="top">
           <img src="https://cdn-icons-png.flaticon.com/512/3069/3069211.png" alt="Logo" class="logo">
           <div class="neon-text">24/7 • +33 (7)44-13-33-54</div>
           <div class="scroll-btn" onclick="smoothScroll('#section2')">↓</div>
       </section>

       <section id="section2" class="section">
           <h2>Section Présentation</h2>
           <p>Lorem ipsum dolor sit amet consectetur adipiscing elit.</p>
       </section>

       <!-- Première image fixe -->
       <div class="img-section">
           <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0" alt="Image fixe" class="fixed-img">
       </div>

       <section id="section3" class="section">
           <h2>Section Services</h2>
           <p>Lorem ipsum dolor sit amet consectetur adipiscing elit.</p>
       </section>

       <!-- Deuxième image fixe -->
       <div class="img-section">
           <img src="https://images.unsplash.com/photo-1493244040629-496f6d136cc3"
       </div>

       <div id="footer">
           © Mon Site Web - Tous droits réservés
       </div>
   </div>

   <script>
       function smoothScroll(target) {
           document.querySelector(target).scrollIntoView({
               behavior:'smooth'
           });
       }
   </script>
</body>
</html>
