<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Haut de page incliné</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Exo">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
            font-family: "Exo";
        }

        body {
            overflow: hidden; /* Bloque TOUS les débordements */
            background-color: black;
        }

        .wrapper {
            width: 100vw;
            overflow: hidden; 
            position: relative;
        }

        .header {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%) rotate(-8deg);
            width: 1900px;
            height: 400px;
            background-color: #2b2b2b;
            border: 4px solid #ffce00;
            border-radius: 30px;
            box-shadow: 0 0 30px 10px #ff007f;
        }
        .particles{
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
        }
        .site {
            position: relative;
            display: flex;
            flex-direction: column ;
            width: 2000px;
            height: 1500px;
            /*max-width: 1000px;*/
            background-color: transparent;
        }
        
        /* mobile (max-width: 768px) */
        @media (max-width: 768px) {
            .header {
                height: 650px;
                width: 1000px;
            }
            .top { 
                flex-wrap: wrap;
            }
        }
        
        
        .top { 
          display: block;
          flex-wrap: wrap;
          width: 100vw;
          max-width: 1000px;
          height: 700px;
          border:1px solid red ;
        }
        
        .logo { 
          --col-bg: rgba(12,12,12, 0.4);
          --col-logo: #ffce00;
          --col-tech: #ffce00;
          --col-repair: #1efedb;
          position: relative;
          display: flex; 
          /*align-items: flex-start;*/
          font-family: "Zen Dots", serif;
          margin: 50px;
          width: 250px !important;
          background-color: var(--col-bg);
          border: 2px solid var(--col-logo);
          border-radius: 15px;
    }
    
    .logo-container {
      background-color: transparent;
      display: inline-block; 
      margin-top: 5px;
      margin-left: 5px;
      margin-bottom: 5px;
      width: 60px;
      height: 90px;
      background-color: var(--col-logo);
      -webkit-mask-image: url('wlogo.png');
      mask-image: url('wlogo.png');
      mask-size: contain;
      mask-repeat: no-repeat;
    }
    .text-container {
      display: flex;
      flex-direction: column;
    }
    .tech {
      position: relative;
      top: -8px ;
      font-size: 65px;
      color: var(--col-tech);
    }
    .repair {
      font-size: 30px; 
      font-weight: bold;
      line-height: 0.8; 
      margin-top: -18px; 
      margin-left: 10px ;
      color: var(--col-repair);
    }
    
 
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
          <div id="jsi-particle-container" class="particles"></div>
        </div>
        <div class="site">
          
          <div class="top">
            <div class="logo">
              <div class="logo-container"></div>
                <div class="text-container">
                  <span class="tech">tech</span>
                  <span class="repair">repair</span>
                </div>
              </div>
              <p>un problème ?</p>
            </div>
        </div>
        
    </div>
    
      <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js'></script>
  <script  src="./particles.js"></script>

</body>
</html>
